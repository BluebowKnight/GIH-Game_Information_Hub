<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情报合集</title>
<style>
  :root {
    --pk-red: #ee1c25;
    --pk-red-dark: #c4121a;
    --pk-yellow: #ffcb05;
    --pk-blue: #2a4b8d;
    --ink: #1f2430;
    --ink-2: #4a5163;
    --ink-3: #828a9c;
    --line: #e5e9f0;
    --bg: #f4f6fa;
    --card: #ffffff;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(31, 36, 48, .06);
    --shadow-hover: 0 10px 28px rgba(31, 36, 48, .14);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* Header */
  .site-header {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--pk-red) 0%, #ff5a3c 55%, var(--pk-yellow) 130%);
    color: #fff;
    padding: 60px 0 50px;
  }

  .site-header::before {
    content: "";
    position: absolute;
    right: -90px; top: -90px;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .13);
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }

  .site-title {
    margin: 0 0 8px;
    font-size: 36px;
    font-weight: 800;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .18);
  }

  .site-sub {
    margin: 0;
    font-size: 15px;
    opacity: .92;
  }

  /* Main */
  main { padding: 40px 0 60px; }

  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }

  .entry-card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
    text-decoration: none;
    color: inherit;
  }

  .entry-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  .entry-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 120px;
    font-size: 48px;
    background: linear-gradient(135deg, var(--pk-red), #ff5a3c);
    color: #fff;
    overflow: hidden;
    position: relative;
  }

  .entry-banner::after {
    content: "";
    position: absolute;
    right: -30px; top: -30px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
  }

  .entry-emoji {
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.2));
  }

  .entry-body {
    padding: 18px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .entry-name {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
  }

  .entry-desc {
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.7;
  }

  .entry-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .entry-tag {
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: #f2f5fa;
    color: var(--ink-3);
    border: 1px solid var(--line);
  }

  .entry-link {
    margin-top: auto;
    padding-top: 8px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--pk-red);
  }

  .entry-card:hover .entry-link {
    text-decoration: underline;
  }

  /* Footer */
  .site-footer {
    margin-top: 40px;
    padding: 24px 0 36px;
    background: #1f2430;
    color: #b9c0d0;
    font-size: 12.5px;
  }

  .site-footer .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  @media (max-width: 600px) {
    .site-title { font-size: 28px; }
    .site-header { padding: 44px 0 36px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">情报合集</h1>
    <p class="site-sub">多个情报站的统一入口，持续扩充中。</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid">
      <a class="entry-card" href="pokemon-tcg-cn/ptcg.html">
        <div class="entry-banner">
          <span class="entry-emoji">⚡️</span>
        </div>
        <div class="entry-body">
          <div class="entry-name">宝可梦简中卡牌情报站</div>
          <div class="entry-desc">
            五个常驻栏目：新品上新、官方赛事、官方道馆、环境牌组、版本赛制。
            数据全部抓取自宝可梦中国官方网站。
          </div>
          <div class="entry-tags">
            <span class="entry-tag">PTCG</span>
            <span class="entry-tag">简体中文版</span>
          </div>
          <div class="entry-link">进入情报站 →</div>
        </div>
      </a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>情报合集</span>
    <span>持续扩充中</span>
  </div>
</footer>

</body>
</html>
